
<html>
<head>
    <title>Grade Calculator</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
            padding: 30px;
        }

        input {
            padding: 10px;
            margin: 8px;
            width: 200px;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
        }

        h2 {
            color: darkblue;
        }
    </style>
</head>

<body>

    <h2>5 Subject Grade Calculator</h2>

    <input type="number" id="mark1"
           placeholder="Enter Subject 1 Mark"><br>

    <input type="number" id="mark2"
           placeholder="Enter Subject 2 Mark"><br>

    <input type="number" id="mark3"
           placeholder="Enter Subject 3 Mark"><br>

    <input type="number" id="mark4"
           placeholder="Enter Subject 4 Mark"><br>

    <input type="number" id="mark5"
           placeholder="Enter Subject 5 Mark"><br><br>

    <button onclick="grade()">Calculate Grade</button>

    <h3 id="result"></h3>

    <script>
        function grade() {

            var mark1 = Number(document.getElementById("mark1").value);
            var mark2 = Number(document.getElementById("mark2").value);
            var mark3 = Number(document.getElementById("mark3").value);
            var mark4 = Number(document.getElementById("mark4").value);
            var mark5 = Number(document.getElementById("mark5").value);

            if (
                document.getElementById("mark1").value === "" ||
                document.getElementById("mark2").value === "" ||
                document.getElementById("mark3").value === "" ||
                document.getElementById("mark4").value === "" ||
                document.getElementById("mark5").value === ""
            ) {
                document.getElementById("result").innerHTML =
                    "Please enter all 5 subject marks!";
                return;
            }

            if ([mark1, mark2, mark3, mark4, mark5].some(
                mark => mark < 0 || mark > 100
            )) {
                document.getElementById("result").innerHTML =
                    "Marks must be between 0 and 100!";
                return;
            }

            var total = mark1 + mark2 + mark3 + mark4 + mark5;
            var average = total / 5;
            var grade;

            if (average >= 90) {
                grade = "A+";
            }
            else if (average >= 80) {
                grade = "A";
            }
            else if (average >= 70) {
                grade = "B";
            }
            else if (average >= 60) {
                grade = "C";
            }
            else if (average >= 50) {
                grade = "D";
            }
            else {
                grade = "F - Fail";
            }

            document.getElementById("result").innerHTML =
                "Total Marks: " + total + " / 500<br>" +
                "Average: " + average.toFixed(2) + "%<br>" +
                "Grade: " + grade;
        }
    </script>

</body>
</html>
